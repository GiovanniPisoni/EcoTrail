services:
  mongo:
    image: mongo:7
    container_name: ecotrail-mongo
    ports:
      - '27017:27017'
    volumes:
      - ecotrail-mongo-data:/data/db
    restart: unless-stopped

  mongo-express:
    image: mongo-express
    container_name: ecotrail-mongo-express
    depends_on:
      - mongo
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
    restart: unless-stopped
volumes:
  ecotrail-mongo-data:
